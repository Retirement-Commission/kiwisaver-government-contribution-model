# Builds this Shiny app with Shinylive and publishes it to GitHub Pages.
# The conversion itself is done by scripts/export-shinylive.R, which also
# sets the browser tab title and icon.
on:
  push:
    branches: [main]
  workflow_dispatch:

name: shinylive-deploy

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two publishes at the same time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
            any::dplyr

      - name: Convert the app with Shinylive
        shell: Rscript {0}
        run: source("scripts/export-shinylive.R")

      - name: Package the site for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
